[package]
name = "mav_joy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mav_joy_node"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# rclrs 0.7.x is the release that pairs with the Rust message crates generated by
# ros-<distro>-rosidl-generator-rs (both use rosidl_runtime_rs 0.6).
rclrs = "0.7.0"
sensor_msgs = "*"
std_msgs = "*"
builtin_interfaces = "*"
mavlink = { version = "0.19", default-features = false, features = ["std", "dialect-common"] }

