[package]
name = "mav_joy"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mav_joy_node"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
# rclrs 0.7.x is the release that pairs with the Rust message crates generated by
# ros-jazzy-rosidl-generator-rs (both use rosidl_runtime_rs 0.6).
rclrs = "0.7.0"
sensor_msgs = "*"
std_msgs = "*"
builtin_interfaces = "*"
mavlink = { version = "0.19", default-features = false, features = ["std", "dialect-common"] }

# The Rust message crates for the installed ROS 2 distro ship with
# ros-jazzy-rosidl-generator-rs (see /opt/ros/jazzy/share/<pkg>/rust), but the
# ament index entry ("rust_packages") that colcon-ros-cargo uses to generate
# these patches is missing from the Debian packages, so we declare them here.
[patch.crates-io]
sensor_msgs = { path = "/opt/ros/jazzy/share/sensor_msgs/rust" }
std_msgs = { path = "/opt/ros/jazzy/share/std_msgs/rust" }
geometry_msgs = { path = "/opt/ros/jazzy/share/geometry_msgs/rust" }
builtin_interfaces = { path = "/opt/ros/jazzy/share/builtin_interfaces/rust" }
service_msgs = { path = "/opt/ros/jazzy/share/service_msgs/rust" }
